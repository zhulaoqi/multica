apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-web
  namespace: multica-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-web
  template:
    metadata:
      labels:
        app: agent-web
    spec:
      nodeName: NODE_NAME
      containers:
        - name: agent-web
          image: WEB_IMAGE
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          env:
            - name: REMOTE_API_URL
              value: http://agent-api.multica-test.svc.cluster.local:8080
            - name: HOSTIP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: docker-log
              mountPath: /docker/log
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: docker-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-web
  namespace: multica-test
spec:
  type: NodePort
  selector:
    app: agent-web
  ports:
    - name: http
      port: 80
      targetPort: http
