apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-web
  namespace: multica-test
spec:
  ingressClassName: INGRESS_CLASS
  rules:
    - host: INGRESS_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-web
                port:
                  number: 80
