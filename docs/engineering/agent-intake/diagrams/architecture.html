<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总体架构</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f6f8fc;
    color: #172033;
    font-family: "Geist", sans-serif;
    padding: 48px 40px 64px;
    -webkit-font-smoothing: antialiased;
  }
  header { max-width: 960px; margin: 0 auto 28px; }
  .eyebrow {
    font-family: "Geist Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #506078;
    margin-bottom: 8px;
  }
  h1 {
    font-family: "Instrument Serif", serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .subtitle { margin-top: 8px; font-size: 16px; line-height: 1.5; color: #506078; max-width: 640px; }
  .frame { max-width: 960px; margin: 0 auto; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; }
  footer {
    max-width: 960px;
    margin: 28px auto 0;
    padding-top: 16px;
    border-top: 1px solid rgba(23,32,51,0.12);
    font-family: "Geist Mono", monospace;
    font-size: 12px;
    color: #5b6c84;
  }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Architecture · doc-inline</p>
  <h1>总体架构</h1>
  <p class="subtitle">同事只打开网页。任务写在 PostgreSQL，在线状态走 Redis，写代码的程序在已经注册的机器上。</p>
</header>
<div class="frame">
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">总体架构</title>
  <desc id="arch-desc">同事通过网页把需求交给 Go 服务，服务把任务写入 PostgreSQL 并用 Redis 同步状态，已注册机器上的守护进程领取任务并调用本机编程工具。</desc>
  <defs>
    <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#506078"/>
    </marker>
    <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#f6f8fc"/>

  <rect x="32" y="56" width="192" height="328" rx="8" fill="rgba(23,32,51,0.03)" stroke="rgba(23,32,51,0.30)" stroke-width="1"/>
  <text x="44" y="80" fill="#5b6c84" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">使用</text>
  <rect x="304" y="56" width="392" height="328" rx="8" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="316" y="80" fill="#5b6c84" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">服务</text>
  <rect x="760" y="56" width="184" height="328" rx="8" fill="rgba(23,32,51,0.03)" stroke="rgba(23,32,51,0.30)" stroke-width="1"/>
  <text x="772" y="80" fill="#5b6c84" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">执行</text>

  <line x1="208" y1="160" x2="320" y2="160" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
  <rect x="240" y="140" width="48" height="12" rx="2" fill="#f6f8fc"/>
  <text x="264" y="148" fill="#1d4ed8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">打开</text>

  <line x1="480" y1="160" x2="528" y2="160" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
  <rect x="488" y="140" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="504" y="148" fill="#1d4ed8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

  <line x1="688" y1="160" x2="768" y2="160" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arch-arrow-accent)"/>
  <rect x="704" y="140" width="48" height="12" rx="2" fill="#f6f8fc"/>
  <text x="728" y="148" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">认领</text>

  <line x1="608" y1="200" x2="608" y2="288" stroke="#506078" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <rect x="616" y="232" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="636" y="240" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">写入</text>

  <path d="M568,200 V232 Q568,240 560,240 H408 Q400,240 400,248 V288" fill="none" stroke="#506078" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <rect x="464" y="220" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="484" y="228" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">状态</text>

  <line x1="848" y1="200" x2="848" y2="288" stroke="#506078" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <rect x="856" y="232" width="40" height="12" rx="2" fill="#f6f8fc"/>
  <text x="876" y="240" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">调用</text>

  <rect x="48" y="120" width="160" height="80" rx="6" fill="#f6f8fc"/>
  <rect x="48" y="120" width="160" height="80" rx="6" fill="rgba(80,96,120,0.10)" stroke="#5b6c84" stroke-width="1"/>
  <text x="128" y="156" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">同事</text>
  <text x="128" y="176" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">浏览器</text>

  <rect x="320" y="120" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="320" y="120" width="160" height="80" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="400" y="156" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">网页</text>
  <text x="400" y="176" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js :80</text>

  <rect x="528" y="120" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="528" y="120" width="160" height="80" rx="6" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="608" y="156" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Go 服务</text>
  <text x="608" y="176" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">:8080</text>

  <rect x="320" y="288" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="320" y="288" width="160" height="80" rx="6" fill="rgba(23,32,51,0.05)" stroke="#506078" stroke-width="1"/>
  <text x="400" y="324" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
  <text x="400" y="344" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7.2</text>

  <rect x="528" y="288" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="528" y="288" width="160" height="80" rx="6" fill="rgba(23,32,51,0.05)" stroke="#506078" stroke-width="1"/>
  <text x="608" y="324" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
  <text x="608" y="344" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">17</text>

  <rect x="768" y="120" width="160" height="80" rx="6" fill="#f6f8fc"/>
  <rect x="768" y="120" width="160" height="80" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="848" y="156" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">守护进程</text>
  <text x="848" y="176" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">每台机器一个</text>

  <rect x="768" y="288" width="160" height="80" rx="6" fill="#f6f8fc"/>
  <rect x="768" y="288" width="160" height="80" rx="6" fill="rgba(23,32,51,0.03)" stroke="rgba(23,32,51,0.30)" stroke-width="1"/>
  <text x="848" y="324" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">编程工具</text>
  <text x="848" y="344" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">本机 CLI</text>

  <line x1="32" y1="432" x2="928" y2="432" stroke="rgba(23,32,51,0.12)" stroke-width="0.8"/>
  <text x="32" y="456" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="444" width="16" height="12" rx="2" fill="#e9f2ff" stroke="#2563eb" stroke-width="1"/>
  <text x="152" y="456" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">调度</text>
  <rect x="228" y="444" width="16" height="12" rx="2" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="252" y="456" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">服务</text>
  <rect x="328" y="444" width="16" height="12" rx="2" fill="rgba(23,32,51,0.05)" stroke="#506078" stroke-width="1"/>
  <text x="352" y="456" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">存储</text>
  <rect x="428" y="444" width="16" height="12" rx="2" fill="rgba(80,96,120,0.10)" stroke="#5b6c84" stroke-width="1"/>
  <text x="452" y="456" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">人</text>
</svg>
</div>
<footer>一期容器只跑网页和 Go 服务。守护进程装在执行机器上。</footer>
</body>
</html>
