  <text x="156" y="596" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">开始</text>
  <rect x="220" y="584" width="16" height="12" rx="2" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="244" y="596" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">状态</text>
  <rect x="320" y="584" width="16" height="12" rx="2" fill="#e9f2ff" stroke="#2563eb" stroke-width="1"/>
  <text x="344" y="596" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">要人决定</text>
  <circle cx="460" cy="592" r="8" fill="none" stroke="#172033" stroke-width="1.2"/>
