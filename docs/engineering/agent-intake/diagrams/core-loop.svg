<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">需求闭环</title>
  <desc id="loop-desc">同事写下需求并命中一个 Agent。做完则待验收，验收后完成。卡住则通知提出人，提出人可以补上信息让同一次执行继续，或让任务停在卡点。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#506078"/>
    </marker>
    <marker id="loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="820" fill="#f6f8fc"/>

  <line x1="248" y1="104" x2="248" y2="144" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <line x1="248" y1="208" x2="248" y2="232" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <line x1="248" y1="376" x2="248" y2="440" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <rect x="256" y="396" width="40" height="12" rx="2" fill="#f6f8fc"/>
  <text x="276" y="404" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">做完</text>

  <line x1="320" y1="304" x2="480" y2="304" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <rect x="376" y="284" width="48" height="12" rx="2" fill="#f6f8fc"/>
  <text x="400" y="292" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">卡住</text>

  <line x1="640" y1="304" x2="688" y2="304" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <rect x="644" y="284" width="40" height="12" rx="2" fill="#f6f8fc"/>
  <text x="664" y="292" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">停止</text>

  <line x1="560" y1="336" x2="560" y2="440" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <rect x="568" y="376" width="40" height="12" rx="2" fill="#f6f8fc"/>
  <text x="588" y="384" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">继续</text>

  <line x1="248" y1="504" x2="248" y2="568" stroke="#506078" stroke-width="1.2" marker-end="url(#loop-arrow)"/>
  <rect x="256" y="524" width="40" height="12" rx="2" fill="#f6f8fc"/>
  <text x="276" y="532" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">验收</text>

  <path d="M560,504 V672 Q560,680 552,680 H72 Q64,680 64,672 V312 Q64,304 72,304 H176" fill="none" stroke="#506078" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#loop-arrow)"/>
  <rect x="248" y="660" width="112" height="12" rx="2" fill="#f6f8fc"/>
  <text x="304" y="668" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">回到同一次执行</text>

  <rect x="168" y="40" width="160" height="64" rx="20" fill="#f6f8fc"/>
  <rect x="168" y="40" width="160" height="64" rx="20" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="248" y="76" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">写下需求</text>

  <rect x="168" y="144" width="160" height="64" rx="6" fill="#f6f8fc"/>
  <rect x="168" y="144" width="160" height="64" rx="6" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="248" y="180" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">命中一个 Agent</text>

  <polygon points="248,232 320,304 248,376 176,304" fill="#f6f8fc"/>
  <polygon points="248,232 320,304 248,376 176,304" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="248" y="308" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">卡住了吗</text>

  <rect x="168" y="440" width="160" height="64" rx="20" fill="#f6f8fc"/>
  <rect x="168" y="440" width="160" height="64" rx="20" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="248" y="476" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">待验收</text>

  <rect x="168" y="568" width="160" height="64" rx="20" fill="#f6f8fc"/>
  <rect x="168" y="568" width="160" height="64" rx="20" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="248" y="604" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">已完成</text>

  <rect x="480" y="272" width="160" height="64" rx="6" fill="#f6f8fc"/>
  <rect x="480" y="272" width="160" height="64" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="560" y="308" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">通知提出人</text>

  <rect x="480" y="440" width="160" height="64" rx="6" fill="#f6f8fc"/>
  <rect x="480" y="440" width="160" height="64" rx="6" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="560" y="476" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">写下补偿信息</text>

  <rect x="688" y="272" width="160" height="64" rx="20" fill="#f6f8fc"/>
  <rect x="688" y="272" width="160" height="64" rx="20" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="768" y="308" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">停在卡点</text>

  <line x1="24" y1="752" x2="856" y2="752" stroke="rgba(23,32,51,0.12)" stroke-width="0.8"/>
  <text x="24" y="776" fill="#506078" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="764" width="16" height="12" rx="2" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="144" y="776" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">步骤</text>
  <rect x="220" y="764" width="16" height="12" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="244" y="776" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">起止</text>
  <polygon points="336,768 344,760 352,768 344,776" fill="#ffffff" stroke="#172033" stroke-width="1"/>
  <text x="364" y="776" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">判断</text>
  <rect x="440" y="764" width="16" height="12" rx="2" fill="#e9f2ff" stroke="#2563eb" stroke-width="1"/>
  <text x="464" y="776" fill="#506078" font-size="8" font-family="'Geist Mono', monospace">同一条任务</text>
</svg>
